<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - ABTalks</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    .profile-card-top {
      text-align: center;
      padding: 10px 20px 25px 20px;
    }
    
    .large-avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-orange), var(--accent-blue));
      margin: 0 auto 15px auto;
      box-shadow: 0 0 20px rgba(163, 255, 51, 0.15);
    }
    
    .large-avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: var(--bg-card);
    }
    
    .profile-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    
    .profile-bio {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 280px;
      margin: 0 auto 20px auto;
    }
    
    .profile-socials {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
    }
    
    .social-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    
    .social-btn:hover {
      background-color: var(--bg-card-hover);
      border-color: rgba(255, 255, 255, 0.15);
    }
    
    .social-btn svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    
    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 0 20px;
      margin-bottom: 25px;
    }
    
    .stat-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 15px 10px;
      text-align: center;
    }
    
    .stat-box-lbl {
      font-size: 8px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    
    .stat-box-val {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
    }
    
    .stat-box-val span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }
    
    /* Trophy Case Grid */
    .trophy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 12px;
    }
    
    .trophy-box {
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all var(--transition-normal);
      opacity: 0.4;
      filter: grayscale(1);
    }
    
    .trophy-box.unlocked {
      opacity: 1;
      filter: none;
      background-color: var(--bg-card);
      border-color: rgba(255, 122, 0, 0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }
    
    .trophy-icon-glow {
      font-size: 32px;
      margin-bottom: 8px;
      display: block;
      filter: drop-shadow(0 0 5px rgba(255,122,0,0));
      transition: filter var(--transition-normal);
    }
    
    .trophy-box.unlocked .trophy-icon-glow {
      filter: drop-shadow(0 0 8px rgba(255, 122, 0, 0.4));
    }
    
    .trophy-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    
    .trophy-desc {
      font-size: 10px;
      color: var(--text-secondary);
    }
    
    /* Settings List */
    .settings-list {
      display: flex;
      flex-direction: column;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      margin: 0 20px 25px 20px;
      overflow: hidden;
    }
    
    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    
    .settings-item:hover {
      background-color: var(--bg-card-hover);
    }
    
    .settings-item:last-child {
      border-bottom: none;
    }
    
    .settings-item svg {
      width: 16px;
      height: 16px;
      stroke: var(--text-muted);
      stroke-width: 2;
      fill: none;
    }
    
    .settings-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .settings-item-left svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-secondary);
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="header">
      <div style="font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px;">Profile</div>
      <button class="notification-btn" style="border-radius: 12px; width: 34px; height: 34px;">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
    
    <!-- Profile Info Card -->
    <div class="profile-card-top">
      <div class="large-avatar-wrapper">
        <img class="large-avatar-img" id="profileAvatar" src="" alt="Avatar">
      </div>
      <h2 class="profile-name" id="profileName">Aarav Sharma</h2>
      <p class="profile-bio" id="profileBio">Full-stack Developer & 60-day Builder. Currently mastering responsive design.</p>
      
      <div class="profile-socials">
        <button class="social-btn" onclick="window.open('https://github.com', '_blank')">
          <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
          GitHub
        </button>
        <button class="social-btn" onclick="window.open('https://linkedin.com', '_blank')">
          <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
          LinkedIn
        </button>
      </div>
    </div>
    
    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-box-lbl">Streak</div>
        <div class="stat-box-val" id="statStreak" style="color: var(--accent-orange);">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-lbl">Completed</div>
        <div class="stat-box-val" id="statCompleted">0<span>/60</span></div>
      </div>
      <div class="stat-box">
        <div class="stat-box-lbl">Unlocked</div>
        <div class="stat-box-val" id="statAchievements" style="color: var(--accent-purple);">0</div>
      </div>
    </div>
    
    <!-- Account Settings -->
    <div class="card-title" style="margin: 10px 20px 10px 20px;">Account</div>
    <div class="settings-list">
      <div class="settings-item">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span>Notification Settings</span>
        </div>
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
      <div class="settings-item">
        <div class="settings-item-left">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>Theme Preferences</span>
        </div>
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
      <div class="settings-item" id="logoutBtn">
        <div class="settings-item-left" style="color: #ef4444;">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="stroke: #ef4444;">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Logout</span>
        </div>
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </div>
    </div>
    
    <!-- Trophy Case -->
    <div class="card" style="margin-top: 15px;">
      <div class="card-title">Trophy Case</div>
      <div class="trophy-grid" id="trophyGrid">
        <!-- Injected dynamically -->
      </div>
    </div>
    
    <!-- Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='../dashboard/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="window.location.href='../day/12/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span>Challenge</span>
      </div>
      <div class="nav-item" onclick="window.location.href='../progress/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Progress</span>
      </div>
      <div class="nav-item active" onclick="window.location.href='../profile/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </div>
    </div>
    
  </div>
  
  <script type="module">
    import { getState, resetAllStates } from '../shared/state.js';
    
    const state = getState();
    
    // Set Profile Info
    document.getElementById("profileName").innerText = state.profileName;
    document.getElementById("profileBio").innerText = state.profileBio;
    
    const avatarImg = document.getElementById("profileAvatar");
    if (state.profileAvatar) {
      avatarImg.src = state.profileAvatar;
    } else {
      avatarImg.style.display = "none";
      const wrapper = avatarImg.parentElement;
      wrapper.style.display = "flex";
      wrapper.style.alignItems = "center";
      wrapper.style.justifyContent = "center";
      wrapper.style.color = "var(--accent-green)";
      wrapper.style.fontWeight = "bold";
      wrapper.style.fontSize = "28px";
      wrapper.innerText = state.profileName.charAt(0);
    }
    
    // Set Profile statistics
    document.getElementById("statStreak").innerText = state.streak;
    document.getElementById("statCompleted").innerHTML = `${state.completedCount}<span>/60</span>`;
    
    const unlockedCount = state.achievements.filter(a => a.unlocked).length;
    document.getElementById("statAchievements").innerText = unlockedCount;
    
    // Logout Handler (clears localStorage and redirects to Landing Page)
    document.getElementById("logoutBtn").addEventListener("click", () => {
      if (confirm("Are you sure you want to logout? This will reset all local states.")) {
        resetAllStates();
        window.location.href = '../';
      }
    });
    
    // Render Trophy grid
    const trophyGrid = document.getElementById("trophyGrid");
    trophyGrid.innerHTML = "";
    
    const achievementEmojis = {
      "first-build": "🏋️‍♂️",
      "7-day": "🔥",
      "10-builds": "🔟",
      "public-builder": "📢"
    };
    
    state.achievements.forEach(ach => {
      const box = document.createElement("div");
      box.className = `trophy-box ${ach.unlocked ? 'unlocked' : ''}`;
      box.innerHTML = `
        <span class="trophy-icon-glow">${achievementEmojis[ach.id] || '🏆'}</span>
        <div class="trophy-name">${ach.title}</div>
        <div class="trophy-desc">${ach.desc}</div>
      `;
      trophyGrid.appendChild(box);
    });
  </script>
</body>
</html>
