<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress - ABTalks</title>
  <link rel="stylesheet" href="../shared/global.css">
  <style>
    .progress-header {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }
    
    .overview-circle-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0 20px 0;
    }
    
    .circular-progress {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--bg-card) 79%, transparent 80% 100%),
                  conic-gradient(var(--accent-green) 0%, var(--bg-input) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 25px;
      transition: background var(--transition-normal);
      border: 1px solid var(--border-color);
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
    }
    
    .circular-progress::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background-color: var(--accent-green);
      border-radius: 50%;
      top: 6px;
      box-shadow: 0 0 10px var(--accent-green);
    }
    
    .progress-value {
      text-align: center;
      font-family: 'Outfit', sans-serif;
    }
    
    .progress-value-big {
      font-size: 38px;
      font-weight: 800;
      color: var(--accent-green);
      line-height: 1;
    }
    
    .progress-value-small {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      font-weight: 500;
    }
    
    /* Skills Meters */
    .skills-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    
    .skill-row {
      width: 100%;
    }
    
    .skill-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }
    
    .skill-pct {
      color: var(--accent-purple);
    }
    
    .skill-track {
      height: 6px;
      background-color: var(--bg-input);
      border-radius: 3px;
      width: 100%;
      overflow: hidden;
    }
    
    .skill-fill {
      height: 100%;
      background: linear-gradient(to right, #9e8eff, var(--accent-purple));
      border-radius: 3px;
      width: 0%;
      transition: width 1s ease-out;
    }
    
    /* Recent Builds List */
    .builds-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    
    .build-item {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    .build-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 15px;
      bottom: 15px;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background-color: var(--accent-green);
    }
    
    .build-day {
      font-size: 10px;
      font-family: 'Fira Code', monospace;
      font-weight: 600;
      color: var(--accent-green);
    }
    
    .build-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .build-badges {
      display: flex;
      gap: 8px;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .badge-code {
      background-color: rgba(140, 182, 255, 0.1);
      border: 1px solid rgba(140, 182, 255, 0.2);
      color: var(--accent-blue);
    }
    
    .badge-social {
      background-color: rgba(255, 117, 181, 0.1);
      border: 1px solid rgba(255, 117, 181, 0.2);
      color: var(--accent-pink);
    }
    
    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-secondary);
      font-size: 13px;
    }
    
    /* Small journey timeline in circular tracker card */
    .mini-journey {
      width: 100%;
      height: 3px;
      background-color: var(--bg-input);
      position: relative;
      border-radius: 1.5px;
    }
    .mini-journey-fill {
      height: 100%;
      background-color: var(--accent-green);
      width: 0%;
      border-radius: 1.5px;
      transition: width var(--transition-normal);
    }
    .mini-journey-nodes {
      display: flex;
      justify-content: space-between;
      margin-top: -6px;
    }
    .mini-node {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--bg-input);
      border: 2px solid #2d3345;
    }
    .mini-node.active {
      background-color: var(--accent-green);
      border-color: var(--accent-green);
      box-shadow: 0 0 5px var(--accent-green);
    }
    .mini-labels {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div class="header">
      <h1 class="progress-header">Progress</h1>
      <button class="notification-btn" style="border-radius: 12px; width: 34px; height: 34px;">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="12" cy="5" r="1"></circle>
          <circle cx="12" cy="19" r="1"></circle>
        </svg>
      </button>
    </div>
    
    <!-- Journey Overview (Circular Ring) -->
    <div class="card">
      <div class="card-title">Journey Overview</div>
      <div class="overview-circle-container">
        <div class="circular-progress" id="circRing">
          <div class="progress-value">
            <div class="progress-value-big" id="completedVal">0</div>
            <div class="progress-value-small">/ 60 BUILDS</div>
          </div>
        </div>
        
        <div class="mini-journey">
          <div class="mini-journey-fill" id="miniFill"></div>
          <div class="mini-journey-nodes">
            <div class="mini-node" id="n1"></div>
            <div class="mini-node" id="n12"></div>
            <div class="mini-node" id="n30"></div>
            <div class="mini-node" id="n45"></div>
            <div class="mini-node" id="n60"></div>
          </div>
        </div>
        <div class="mini-labels" style="width: 100%;">
          <span>Day 1</span>
          <span>Day 12</span>
          <span>Day 30</span>
          <span>Day 45</span>
          <span>Day 60</span>
        </div>
      </div>
    </div>
    
    <!-- Skills Acquired -->
    <div class="card">
      <div class="card-title">Skills Acquired</div>
      <div class="skills-container">
        <div class="skill-row">
          <div class="skill-header">
            <span>LAYOUT (FLEX/GRID)</span>
            <span class="skill-pct" id="layoutPct">0%</span>
          </div>
          <div class="skill-track">
            <div class="skill-fill" id="layoutFill"></div>
          </div>
        </div>
        
        <div class="skill-row">
          <div class="skill-header">
            <span>STATE MANAGEMENT</span>
            <span class="skill-pct" id="statePct">0%</span>
          </div>
          <div class="skill-track">
            <div class="skill-fill" id="stateFill"></div>
          </div>
        </div>
        
        <div class="skill-row">
          <div class="skill-header">
            <span>API INTEGRATION</span>
            <span class="skill-pct" id="apiPct">0%</span>
          </div>
          <div class="skill-track">
            <div class="skill-fill" id="apiFill"></div>
          </div>
        </div>
        
        <div class="skill-row">
          <div class="skill-header">
            <span>AUTHENTICATION</span>
            <span class="skill-pct" id="authPct">0%</span>
          </div>
          <div class="skill-track">
            <div class="skill-fill" id="authFill"></div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Recent Builds -->
    <div class="card-title" style="margin: 10px 20px 10px 20px;">Recent Builds</div>
    <div style="padding: 0 20px;">
      <div class="builds-list" id="buildsList">
        <!-- Injected dynamically -->
      </div>
    </div>
    
    <!-- Navigation Bar -->
    <div class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='../dashboard/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </div>
      <div class="nav-item" onclick="window.location.href='../day/12/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span>Challenge</span>
      </div>
      <div class="nav-item active" onclick="window.location.href='../progress/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Progress</span>
      </div>
      <div class="nav-item" onclick="window.location.href='../profile/'">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
      </div>
    </div>
    
  </div>
  
  <script type="module">
    import { getState } from '../shared/state.js';
    
    const state = getState();
    
    // Total Builds value
    const compCount = state.completedCount;
    document.getElementById("completedVal").innerText = compCount;
    
    // Set conic-gradient value for circular Ring progress
    const degrees = (compCount / 60) * 360;
    const ring = document.getElementById("circRing");
    ring.style.background = `radial-gradient(closest-side, var(--bg-card) 79%, transparent 80% 100%), conic-gradient(var(--accent-green) ${degrees}deg, var(--bg-input) ${degrees}deg)`;
    
    // Compute progress slider percentage
    let fillPct = 0;
    if (compCount >= 60) fillPct = 100;
    else if (compCount >= 45) fillPct = 75 + ((compCount-45)/15)*25;
    else if (compCount >= 30) fillPct = 50 + ((compCount-30)/15)*25;
    else if (compCount >= 12) fillPct = 20 + ((compCount-12)/18)*30;
    else if (compCount > 0) fillPct = 0 + (compCount/12)*20;
    
    document.getElementById("miniFill").style.width = `${fillPct}%`;
    
    // Set mini nodes
    const n1 = document.getElementById("n1");
    const n12 = document.getElementById("n12");
    const n30 = document.getElementById("n30");
    const n45 = document.getElementById("n45");
    const n60 = document.getElementById("n60");
    
    if (compCount >= 1) n1.className = "mini-node active";
    if (compCount >= 12) n12.className = "mini-node active";
    if (compCount >= 30) n30.className = "mini-node active";
    if (compCount >= 45) n45.className = "mini-node active";
    if (compCount >= 60) n60.className = "mini-node active";
    
    // Skills bars animation values
    document.getElementById("layoutPct").innerText = `${state.skills.layout}%`;
    document.getElementById("layoutFill").style.width = `${state.skills.layout}%`;
    
    document.getElementById("statePct").innerText = `${state.skills.state}%`;
    document.getElementById("stateFill").style.width = `${state.skills.state}%`;
    
    document.getElementById("apiPct").innerText = `${state.skills.api}%`;
    document.getElementById("apiFill").style.width = `${state.skills.api}%`;
    
    document.getElementById("authPct").innerText = `${state.skills.auth}%`;
    document.getElementById("authFill").style.width = `${state.skills.auth}%`;
    
    // Recent builds logs feed rendering
    const list = document.getElementById("buildsList");
    list.innerHTML = "";
    
    const allBuilds = [
      { day: 12, name: "Responsive Developer Profile Card", type: "both" },
      { day: 11, name: "Responsive Landing Page Redux", type: "both" },
      { day: 10, name: "Auth Flow Implementation", type: "code" },
      { day: 9, name: "API Rate Limiter Service", type: "none" }
    ];
    
    // Filter builds according to completedDays array
    const completedBuilds = allBuilds.filter(b => state.completedDays.includes(b.day));
    
    if (completedBuilds.length === 0) {
      list.innerHTML = `<div class="empty-state">No builds submitted yet. Complete a challenge to start building your streak!</div>`;
    } else {
      completedBuilds.forEach(b => {
        const item = document.createElement("div");
        item.className = "build-item";
        
        let badgesHtml = "";
        if (b.type === "both") {
          badgesHtml = `
            <div class="build-badges">
              <span class="badge badge-code">✓ Code Verified</span>
              <span class="badge badge-social">✓ Social Shared</span>
            </div>
          `;
        } else if (b.type === "code") {
          badgesHtml = `
            <div class="build-badges">
              <span class="badge badge-code">✓ Code Verified</span>
            </div>
          `;
        }
        
        item.innerHTML = `
          <div class="build-day">DAY ${b.day < 10 ? '0'+b.day : b.day}</div>
          <div class="build-name">${b.name}</div>
          ${badgesHtml}
        `;
        
        list.appendChild(item);
      });
    }
  </script>
</body>
</html>
