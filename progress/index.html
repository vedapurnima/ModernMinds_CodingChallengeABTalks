<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Progress - ABTalks</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Hanken+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../shared/global.css">
  
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "background": "var(--bg-main)",
            "surface": "var(--bg-card)",
            "surface-dim": "var(--bg-surface-dim)",
            "surface-container": "var(--bg-surface-container)",
            "surface-container-highest": "var(--bg-surface-container-highest)",
            "on-surface": "var(--text-primary)",
            "on-surface-variant": "var(--text-secondary)",
            "primary-fixed": "var(--accent-green)",
            "primary-fixed-dim": "var(--accent-green-dim)",
            "secondary": "var(--accent-blue)",
            "tertiary-fixed-dim": "var(--accent-purple)",
            "outline-variant": "var(--border-color)",
            "primary": "var(--text-primary)",
            "on-primary-fixed": "#111f00"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "base": "8px",
            "gutter": "16px",
            "section-gap": "40px",
            "container-margin": "24px",
            "card-padding": "20px"
          },
          "fontFamily": {
            "body-md": ["Geist"],
            "headline-lg": ["Hanken Grotesk"],
            "display-xl": ["Hanken Grotesk"],
            "headline-md": ["Hanken Grotesk"],
            "label-sm": ["JetBrains Mono"],
            "headline-lg-mobile": ["Hanken Grotesk"]
          },
          "fontSize": {
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "display-xl": ["64px", { "lineHeight": "72px", "letterSpacing": "-0.04em", "fontWeight": "800" }],
            "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
            "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500" }],
            "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
          }
        }
      }
    };
  </script>
  
  <script>
    if (localStorage.getItem("abt_theme") === "light") {
      document.documentElement.classList.remove("dark");
      document.documentElement.classList.add("light-theme");
    }
  </script>
  
  <style>
    body { background-color: var(--bg-main); color: var(--text-primary); }
    .card-border { border: 1px solid var(--border-color); }
    
    /* Conic circular progress styling */
    .circular-progress {
      position: relative;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 250ms ease;
    }
    
    .pb-nav { padding-bottom: 80px; }
  </style>
</head>
<body class="font-body-md text-body-md min-h-screen flex flex-col pb-nav">
  
  <div class="max-w-[412px] mx-auto w-full min-h-screen bg-background border-l border-r border-outline-variant/30 relative flex flex-col pb-24">
    
    <!-- TopAppBar -->
    <header class="w-full bg-surface text-primary font-headline-md text-headline-md-mobile flex items-center justify-between px-gutter py-base border-b border-outline-variant/10 z-40">
      <h1 class="font-bold tracking-tight">Progress</h1>
      <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-highest transition-colors notification-btn relative">
        <span class="material-symbols-outlined text-on-surface-variant">notifications</span>
      </button>
    </header>
    
    <main class="flex-grow w-full px-4 py-6 flex flex-col gap-6">
      
      <!-- Journey Overview Circular card -->
      <div class="bg-surface rounded-xl p-card-padding card-border flex flex-col items-center">
        <h3 class="font-label-sm text-xs font-bold text-on-surface-variant uppercase mb-4 self-start">Journey Overview</h3>
        <div class="circular-progress mb-6 border border-outline-variant/30" id="circRing">
          <div class="text-center">
            <span class="font-display-xl text-3xl font-extrabold text-primary-fixed" id="completedVal">0</span>
            <span class="block text-2xs font-bold text-on-surface-variant mt-1">/ 60 BUILDS</span>
          </div>
        </div>
        
        <!-- mini journey progress line inside circle overview -->
        <div class="relative w-full h-[3px] bg-surface-container rounded-full mb-4">
          <div class="absolute top-0 left-0 h-full bg-primary-fixed rounded-full" id="miniFill" style="width: 0%;"></div>
          <div class="absolute top-1/2 -translate-y-1/2 left-[0%] w-2 h-2 rounded-full bg-surface-container border border-outline-variant" id="n1"></div>
          <div class="absolute top-1/2 -translate-y-1/2 left-[20%] w-2 h-2 rounded-full bg-surface-container border border-outline-variant" id="n12"></div>
          <div class="absolute top-1/2 -translate-y-1/2 left-[50%] w-2 h-2 rounded-full bg-surface-container border border-outline-variant" id="n30"></div>
          <div class="absolute top-1/2 -translate-y-1/2 left-[75%] w-2 h-2 rounded-full bg-surface-container border border-outline-variant" id="n45"></div>
          <div class="absolute top-1/2 -translate-y-1/2 left-[100%] -translate-x-full w-2 h-2 rounded-full bg-surface-container border border-outline-variant" id="n60"></div>
        </div>
        <div class="flex justify-between w-full text-3xs font-bold text-on-surface-variant font-label-sm">
          <span>Day 1</span>
          <span>Day 12</span>
          <span>Day 30</span>
          <span>Day 45</span>
          <span>Day 60</span>
        </div>
      </div>
      
      <!-- Skills Acquired -->
      <div class="bg-surface rounded-xl p-card-padding card-border flex flex-col">
        <h3 class="font-label-sm text-xs font-bold text-on-surface-variant uppercase mb-4">Skills Acquired</h3>
        
        <div class="space-y-4">
          <div>
            <div class="flex justify-between text-2xs font-bold text-on-surface-variant mb-2">
              <span>LAYOUT (FLEX/GRID)</span>
              <span class="text-tertiary-fixed-dim" id="layoutPct">0%</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full bg-tertiary-fixed-dim rounded-full" id="layoutFill" style="width: 0%;"></div>
            </div>
          </div>
          
          <div>
            <div class="flex justify-between text-2xs font-bold text-on-surface-variant mb-2">
              <span>STATE MANAGEMENT</span>
              <span class="text-tertiary-fixed-dim" id="statePct">0%</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full bg-tertiary-fixed-dim rounded-full" id="stateFill" style="width: 0%;"></div>
            </div>
          </div>
          
          <div>
            <div class="flex justify-between text-2xs font-bold text-on-surface-variant mb-2">
              <span>API INTEGRATION</span>
              <span class="text-tertiary-fixed-dim" id="apiPct">0%</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full bg-tertiary-fixed-dim rounded-full" id="apiFill" style="width: 0%;"></div>
            </div>
          </div>
          
          <div>
            <div class="flex justify-between text-2xs font-bold text-on-surface-variant mb-2">
              <span>AUTHENTICATION</span>
              <span class="text-tertiary-fixed-dim" id="authPct">0%</span>
            </div>
            <div class="w-full h-2 bg-surface-container rounded-full overflow-hidden">
              <div class="h-full bg-tertiary-fixed-dim rounded-full" id="authFill" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Recent Builds -->
      <div>
        <h3 class="font-label-sm text-xs font-bold text-on-surface-variant uppercase mb-4 ml-1">Recent Builds</h3>
        <div class="flex flex-col gap-4" id="buildsList">
          <!-- Recent builds are injected dynamically -->
        </div>
      </div>
    </main>
    
    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 z-50 flex justify-around items-center px-4 py-3 bg-surface-container/90 backdrop-blur-md rounded-t-xl border-t border-outline-variant/10 w-full max-w-[412px] left-1/2 -translate-x-1/2 shadow-lg">
      <a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest p-2 rounded-lg active:scale-95" href="../dashboard/">
        <span class="material-symbols-outlined">home</span>
        <span class="font-label-sm text-xs mt-1">Home</span>
      </a>
      <a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest p-2 rounded-lg active:scale-95" href="../day/12/">
        <span class="material-symbols-outlined">fitness_center</span>
        <span class="font-label-sm text-xs mt-1">Challenge</span>
      </a>
      <a class="flex flex-col items-center justify-center text-primary-fixed drop-shadow-[0_0_8px_rgba(150,218,35,0.5)] p-2 active:scale-95 transition-all duration-200" href="../progress/">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">leaderboard</span>
        <span class="font-label-sm text-xs mt-1">Progress</span>
      </a>
      <a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest p-2 rounded-lg active:scale-95" href="../profile/">
        <span class="material-symbols-outlined">person</span>
        <span class="font-label-sm text-xs mt-1">Profile</span>
      </a>
    </nav>
  </div>

  <script type="module">
    import { getState } from '../shared/state.js';
    
    const state = getState();
    const compCount = state.completedCount;
    document.getElementById("completedVal").innerText = compCount;
    
    // Circular Ring dynamic degrees
    const pct = compCount / 60;
    const ring = document.getElementById("circRing");
    const degrees = pct * 360;
    
    ring.style.background = `radial-gradient(closest-side, var(--bg-card) 79%, transparent 80% 100%), conic-gradient(var(--accent-green) ${degrees}deg, var(--bg-surface-container) ${degrees}deg)`;
    
    // Compute progress slider percentage
    let fillPct = 0;
    if (compCount >= 60) fillPct = 100;
    else if (compCount >= 45) fillPct = 75 + ((compCount-45)/15)*25;
    else if (compCount >= 30) fillPct = 50 + ((compCount-30)/15)*25;
    else if (compCount >= 12) fillPct = 20 + ((compCount-12)/18)*30;
    else if (compCount > 0) fillPct = (compCount/12)*20;
    
    document.getElementById("miniFill").style.width = `${fillPct}%`;
    
    // mini nodes
    const n1 = document.getElementById("n1");
    const n12 = document.getElementById("n12");
    const n30 = document.getElementById("n30");
    const n45 = document.getElementById("n45");
    const n60 = document.getElementById("n60");
    
    if (compCount >= 1) n1.style.backgroundColor = "var(--accent-green)";
    if (compCount >= 12) n12.style.backgroundColor = "var(--accent-green)";
    if (compCount >= 30) n30.style.backgroundColor = "var(--accent-green)";
    if (compCount >= 45) n45.style.backgroundColor = "var(--accent-green)";
    if (compCount >= 60) n60.style.backgroundColor = "var(--accent-green)";
    
    // Skills indicators
    document.getElementById("layoutPct").innerText = `${state.skills.layout}%`;
    document.getElementById("layoutFill").style.width = `${state.skills.layout}%`;
    
    document.getElementById("statePct").innerText = `${state.skills.state}%`;
    document.getElementById("stateFill").style.width = `${state.skills.state}%`;
    
    document.getElementById("apiPct").innerText = `${state.skills.api}%`;
    document.getElementById("apiFill").style.width = `${state.skills.api}%`;
    
    document.getElementById("authPct").innerText = `${state.skills.auth}%`;
    document.getElementById("authFill").style.width = `${state.skills.auth}%`;
    
    // Recent logs list
    const list = document.getElementById("buildsList");
    list.innerHTML = "";
    
    const allBuilds = [
      { day: 12, name: "Responsive Developer Profile Card", type: "both" },
      { day: 11, name: "Responsive Landing Page Redux", type: "both" },
      { day: 10, name: "Auth Flow Implementation", type: "code" },
      { day: 9, name: "API Rate Limiter Service", type: "none" }
    ];
    
    const completedBuilds = allBuilds.filter(b => state.completedDays.includes(b.day));
    
    if (completedBuilds.length === 0) {
      list.innerHTML = `
        <div class="text-center p-8 bg-surface rounded-xl card-border text-on-surface-variant text-sm">
          No builds submitted yet. Complete a challenge to start building your streak!
        </div>
      `;
    } else {
      completedBuilds.forEach(b => {
        const item = document.createElement("div");
        item.className = "bg-surface rounded-xl p-card-padding card-border relative overflow-hidden flex flex-col gap-3";
        
        let badgesHtml = "";
        if (b.type === "both") {
          badgesHtml = `
            <div class="flex gap-2 text-3xs font-bold">
              <span class="px-2 py-1 bg-[#a3c9ff]/10 text-secondary border border-[#a3c9ff]/20 rounded-md">✓ CODE VERIFIED</span>
              <span class="px-2 py-1 bg-[#ff69b4]/10 text-accent-pink border border-[#ff69b4]/20 rounded-md">✓ SOCIAL SHARED</span>
            </div>
          `;
        } else if (b.type === "code") {
          badgesHtml = `
            <div class="flex gap-2 text-3xs font-bold">
              <span class="px-2 py-1 bg-[#a3c9ff]/10 text-secondary border border-[#a3c9ff]/20 rounded-md">✓ CODE VERIFIED</span>
            </div>
          `;
        }
        
        item.innerHTML = `
          <div class="absolute left-0 top-3 bottom-3 w-1 bg-primary-fixed rounded-r"></div>
          <div class="text-3xs font-label-sm text-primary-fixed font-bold">DAY ${b.day < 10 ? '0'+b.day : b.day}</div>
          <div class="font-headline-md text-sm font-bold text-primary">${b.name}</div>
          ${badgesHtml}
        `;
        list.appendChild(item);
      });
    }
  </script>
</body>
</html>
